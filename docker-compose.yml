# Runs the whole site on one DigitalOcean Droplet:
#   docker compose up -d --build            start database, website and HTTPS
#   docker compose run --rm seed            load the starter content (first time only)
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: allintanzania
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: allintanzania
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U allintanzania']
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://allintanzania:${POSTGRES_PASSWORD}@db:5432/allintanzania
    volumes:
      - media:/app/media
      - private:/app/private
    depends_on:
      db:
        condition: service_healthy

  seed:
    profiles: ['tools']
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://allintanzania:${POSTGRES_PASSWORD}@db:5432/allintanzania
    volumes:
      - media:/app/media
      - private:/app/private
      - ./gallery-import:/app/gallery-import:ro
    command: npm run seed
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-redirect.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - app

volumes:
  pgdata:
  media:
  private:
  caddy:
